[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "str-pdf"
description = "Offline PDF to PDF/A conversion with independent veraPDF verification."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["tkinterdnd2>=0.4,<0.5"]
dynamic = ["version"]

[project.optional-dependencies]
build = ["pyinstaller>=6.13,<7"]

[project.gui-scripts]
str-pdf = "str_pdf.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "str_pdf.__version__" }
